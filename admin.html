<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T3K // OWNER MAILBOX</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#300000,#060000 35%,#020202 75%);color:#fff;font-family:Arial,sans-serif;padding:30px}.wrap{max-width:1100px;margin:auto}.card{background:rgba(12,12,12,.94);border:1px solid #620000;box-shadow:0 0 60px #300000;padding:25px;border-radius:16px}.brand{font-weight:900;letter-spacing:8px;color:#ff2020;font-size:32px}.muted{color:#777}.login{max-width:480px;margin:12vh auto}.input{width:100%;padding:14px;background:#050505;color:#fff;border:1px solid #3a1515;margin:12px 0;outline:0}.btn{padding:13px 18px;background:#b40000;color:#fff;border:0;cursor:pointer;font-weight:800}.btn:hover{background:#f00000}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.app{border:1px solid #2d1111;background:linear-gradient(145deg,#111,#070303);padding:20px;margin:14px 0;border-radius:10px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.skill{border:1px solid #351313;padding:10px}.delete{float:right;background:#3a0000}.error{color:#ff6666}.hidden{display:none}@media(max-width:700px){.row{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div id="login" class="card login"><div class="brand">T3K</div><p class="muted">OWNER MAILBOX // SECURE ACCESS</p><input id="pw" class="input" type="password" placeholder="Owner-Passwort"><button id="loginBtn" class="btn">POSTFACH ÖFFNEN</button><p id="err" class="error"></p></div><div id="mailbox" class="hidden"><div class="top"><div><div class="brand">T3K // POSTFACH</div><div class="muted">Nur für Owner</div></div><button id="logout" class="btn">LOGOUT</button></div><div id="apps"></div></div></div><script>
const login=document.getElementById('login'), mailbox=document.getElementById('mailbox'), apps=document.getElementById('apps'), err=document.getElementById('err');
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Fehler');return d}
async function load(){const data=await api('/api/applications');apps.innerHTML=data.length?data.map(a=>`<article class="app"><button class="btn delete" onclick="del('${a.id}')">LÖSCHEN</button><h2>${esc(a.name)}</h2><div class="muted">Alter: ${esc(a.age)} · ${new Date(a.createdAt).toLocaleString('de-DE')}</div><p>${esc(a.reason).replace(/\n/g,'<br>')}</p><div class="row">${Object.entries(a.skills).map(([k,v])=>`<div class="skill"><b>${k.toUpperCase()}</b><br>${v} / 5</div>`).join('')}</div></article>`).join(''):'<div class="card"><p class="muted">Noch keine Bewerbungen.</p></div>'}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function del(id){if(confirm('Bewerbung wirklich löschen?')){await api('/api/applications/'+id,{method:'DELETE'});load()}}
document.getElementById('loginBtn').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});login.classList.add('hidden');mailbox.classList.remove('hidden');load()}catch(e){err.textContent=e.message}};
document.getElementById('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
</script></body></html>
