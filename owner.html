<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#050505"><title>T3K // OWNER LOGIN</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#300000,#060000 38%,#020202 78%);color:#fff;font-family:Arial,Helvetica,sans-serif;padding:24px}.wrap{max-width:1100px;margin:auto}.panel{background:rgba(9,9,9,.96);border:1px solid #541010;box-shadow:0 0 60px rgba(180,0,0,.18);padding:24px;border-radius:18px}.login{max-width:460px;margin:10vh auto}.brand{font-size:34px;font-weight:900;letter-spacing:7px;color:#ef2020}.muted{color:#777;letter-spacing:1px}.input{width:100%;padding:14px;margin:14px 0;background:#050505;color:#fff;border:1px solid #431515;border-radius:8px;outline:none}.input:focus{border-color:#d00000}.btn{padding:12px 16px;background:#a90000;color:#fff;border:1px solid #e00000;border-radius:8px;font-weight:800;cursor:pointer}.btn:hover{background:#e00000}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{padding:14px;background:#0d0505;border:1px solid #321010;border-radius:10px}.stat small{display:block;color:#777}.stat strong{font-size:22px;color:#ff3333}.app{position:relative;margin:12px 0;padding:20px;background:linear-gradient(145deg,#110606,#080808);border:1px solid #321111;border-radius:12px}.app h2{margin:0 0 8px;padding-right:90px}.meta{color:#777;font-size:12px}.reason{line-height:1.5;color:#ddd;white-space:normal;word-break:break-word}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.skill{padding:10px;text-align:center;border:1px solid #351313;background:#090909;border-radius:8px}.skill b{color:#ff3a3a}.delete{position:absolute;right:14px;top:14px;background:#320000;border-color:#620000}.empty{text-align:center;padding:50px;color:#666}.back{display:inline-block;margin-top:15px;color:#888;text-decoration:none}.back:hover{color:#fff}.error{color:#ff6666;min-height:20px}.subhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.refresh{margin-bottom:18px}@media(max-width:650px){.skills{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.subhead{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section id="login" class="panel login">
<div class="brand">T3K</div><p class="muted">OWNER LOGIN // RESTRICTED ACCESS</p>
<input id="pw" class="input" type="password" placeholder="Owner-Passwort" autocomplete="current-password">
<button id="loginBtn" class="btn" type="button">OWNER LOGIN</button><p id="err" class="error"></p><a class="back" href="index.html">← ZURÜCK ZU T3K</a>
</section>
<section id="mailbox" class="hidden">
<div class="top"><div><div class="brand">T3K // OWNER</div><div class="muted">BEWERBUNGEN // CONTROL CENTER</div></div><button id="logout" class="btn" type="button">LOGOUT</button></div>
<div class="stats"><div class="stat"><small>BEWERBUNGEN</small><strong id="total">0</strong></div><div class="stat"><small>STATUS</small><strong>ONLINE</strong></div><div class="stat"><small>ZUGRIFF</small><strong>OWNER</strong></div></div>
<div class="subhead"><h2>ALLE BEWERBUNGEN</h2><button id="refresh" class="btn" type="button">AKTUALISIEREN</button></div><div id="apps" class="refresh"></div>
<a class="back" href="index.html">← ZURÜCK ZU T3K</a>
</section>
</div>
<script>
const API='api/applications.php';const login=document.getElementById('login'),mailbox=document.getElementById('mailbox'),apps=document.getElementById('apps'),err=document.getElementById('err');
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function loginOwner(){err.textContent='';const pw=document.getElementById('pw').value;if(!pw){err.textContent='Bitte Passwort eingeben.';return}const b=document.getElementById('loginBtn');b.disabled=true;try{const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Login fehlgeschlagen');showMailbox();}catch(e){err.textContent=e.message;document.getElementById('pw').value=''}finally{b.disabled=false}}
async function load(){apps.innerHTML='<div class="panel empty">LADEN...</div>';try{const r=await fetch(API+'?action=list',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Keine Berechtigung');const data=d.applications||[];document.getElementById('total').textContent=data.length;apps.innerHTML=data.length?data.map(a=>`<article class="app"><button class="btn delete" type="button" data-id="${esc(a.id)}">LÖSCHEN</button><h2>${esc(a.name)}</h2><div class="meta">ALTER: ${esc(a.age)} · ${esc(a.createdAtDisplay||a.createdAt||'-')}</div><p class="reason">${esc(a.reason).replace(/
/g,'<br>')}</p><div class="skills">${Object.entries(a.skills||{}).map(([k,v])=>`<div class="skill"><b>${esc(k).toUpperCase()}</b><br>${esc(v)} / 5</div>`).join('')}</div></article>`).join(''):'<div class="panel empty">NOCH KEINE BEWERBUNGEN</div>';apps.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>removeApp(b.dataset.id)));}catch(e){apps.innerHTML='<div class="panel empty">'+esc(e.message)+'</div>'}}
async function removeApp(id){if(!confirm('Bewerbung wirklich löschen?'))return;const r=await fetch(API+'?action=delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});const d=await r.json();if(!r.ok||!d.success){alert(d.message||'Löschen fehlgeschlagen');return}load()}
function showMailbox(){login.classList.add('hidden');mailbox.classList.remove('hidden');load()}
document.getElementById('loginBtn').addEventListener('click',loginOwner);document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')loginOwner()});document.getElementById('refresh').addEventListener('click',load);document.getElementById('logout').addEventListener('click',async()=>{await fetch(API+'?action=logout',{method:'POST'});location.reload()});
fetch(API+'?action=session',{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d.authenticated)showMailbox()}).catch(()=>{});
</script>
</body>
</html>
